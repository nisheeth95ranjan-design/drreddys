<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AasanReport Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: Apple-style shell — quiet grey canvas, white cards, one purple accent; sidebar on desktop, tab bar on phones. */
:root{
  --accent:#5225B5; --accent-ink:#ffffff; --accent-soft:rgba(82,37,181,.10);
  --bg:#F5F5F7; --side:#EFEFF3; --card:#FFFFFF; --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#8E8E93;
  --line:#E5E5EA; --fill:#E9E9EE;
  --good:#34C759; --good-ink:#248A3D; --warn:#FF9500; --warn-ink:#C93400; --bad:#FF3B30; --bad-ink:#D70015; --info:#007AFF;
  --tip:#FEF8EC; --ai:#F4EFFE; --wa:#DCF8C6;
  --font-body:"DM Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:14px; --r-sm:9px; --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#9C7BF2; --accent-ink:#14082E; --accent-soft:rgba(156,123,242,.16);
    --bg:#111114; --side:#17171B; --card:#1D1D22; --ink:#F2F2F5; --ink-2:#A8A8B0; --ink-3:#8A8A93;
    --line:#2C2C33; --fill:#2A2A31; --good-ink:#5BD77B; --warn-ink:#FFB347; --bad-ink:#FF6B63;
    --tip:#2A2418; --ai:#221B33; --wa:#1F3A26; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --accent:#9C7BF2; --accent-ink:#14082E; --accent-soft:rgba(156,123,242,.16);
  --bg:#111114; --side:#17171B; --card:#1D1D22; --ink:#F2F2F5; --ink-2:#A8A8B0; --ink-3:#8A8A93;
  --line:#2C2C33; --fill:#2A2A31; --good-ink:#5BD77B; --warn-ink:#FFB347; --bad-ink:#FF6B63;
  --tip:#2A2418; --ai:#221B33; --wa:#1F3A26; --shadow:none; color-scheme:dark;
}
:root[data-contrast="high"]{ --ink-2:var(--ink); --ink-3:var(--ink); --line:var(--ink); --fill:transparent; --shadow:none; }
:root[data-contrast="high"] .card, :root[data-contrast="high"] .tile, :root[data-contrast="high"] .chip, :root[data-contrast="high"] .seg{ outline:1.5px solid var(--ink); }
:root[data-size="large"]{ font-size:18px; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
:root[data-size="large"] body{font-size:17px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
h3{font-size:17px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px} .xs{font-size:12px}
.app{display:grid;grid-template-columns:256px 1fr;height:100%}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;padding:0 6px}
.logo i{width:20px;height:20px;border-radius:50%;background:var(--accent);display:block}
.profile{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px;border:0;text-align:left;width:100%}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
.abha{color:var(--good-ink);font-size:12px;font-weight:500;display:flex;align-items:center;gap:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);padding:6px 10px 4px;text-transform:uppercase}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;font-size:14px;color:var(--ink)}
.nav button:hover{background:var(--fill)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--fill);color:var(--ink-2)}
.badge.warn{background:rgba(255,149,0,.16);color:var(--warn-ink)}
.display-box{margin-top:auto;background:var(--card);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.toggle-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.toggle-row span{flex:1}
.switch{width:42px;height:26px;border-radius:13px;border:0;background:var(--fill);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:18px}
/* main */
main{overflow-y:auto;height:100%}
.page{max-width:1180px;margin:0 auto;padding:32px 40px 56px;display:flex;flex-direction:column;gap:24px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .titles{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}
.search{position:relative;width:260px}
.search input{width:100%;border:0;background:var(--fill);border-radius:10px;padding:9px 12px 9px 34px;font-size:14px}
.search svg{position:absolute;left:10px;top:10px;width:16px;height:16px;color:var(--ink-3)}
.results{position:absolute;top:44px;left:0;right:0;background:var(--card);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:20;overflow:hidden}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;font-size:14px}
.results button:hover,.results button:focus{background:var(--fill)}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:100px;padding:9px 16px;font-size:14px;font-weight:600;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);padding:6px 4px}
.btn.danger{background:rgba(255,59,48,.12);color:var(--bad-ink)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:var(--r-card);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card.tip{background:var(--tip)} .card.ai{background:var(--ai)}
.card-head{display:flex;align-items:center;gap:10px}
.card-head .t{flex:1;min-width:0}
.icon-tile{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.icon-tile.solid{background:var(--accent);color:var(--accent-ink)}
.icon-tile svg{width:18px;height:18px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1fr) 360px}
.section-head{display:flex;align-items:center;gap:8px}
.section-head h2{flex:1}
/* hero */
.hero{flex-direction:row;align-items:center;gap:28px;padding:28px;flex-wrap:wrap}
.hero .lead{flex:1;min-width:260px;display:flex;flex-direction:column;gap:8px}
.hero .lead p.big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.tiles{display:flex;gap:12px;flex-wrap:wrap}
.tile{border:0;text-align:left;border-radius:14px;padding:14px 18px;width:140px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:32px;line-height:1.1}
.tile.g{background:rgba(52,199,89,.12)} .tile.g b{color:var(--good-ink)}
.tile.o{background:rgba(255,149,0,.12)} .tile.o b{color:var(--warn-ink)}
.tile.b{background:rgba(0,122,255,.10)} .tile.b b{color:var(--info)}
.tile span{font-size:13px;font-weight:500}
/* value cards */
.vcard{cursor:pointer;border:0;text-align:left;font:inherit;color:inherit}
.vcard:hover{box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.vrow{display:flex;align-items:baseline;gap:4px}
.vrow .v{font-size:32px;font-weight:700;letter-spacing:-.02em}
.vrow .u{color:var(--ink-2);font-size:14px;font-weight:500}
.vrow .pill{margin-left:auto;align-self:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:100px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:rgba(52,199,89,.14);color:var(--good-ink)}
.pill.warn{background:rgba(255,149,0,.15);color:var(--warn-ink)}
.pill.bad{background:rgba(255,59,48,.13);color:var(--bad-ink)}
.pill.neutral{background:var(--fill);color:var(--ink-2)}
.pill.neutral::before{display:none}
.info-btn{border:0;background:none;color:var(--ink-3);padding:2px;border-radius:50%;display:grid;place-items:center}
.info-btn svg{width:18px;height:18px}
/* range bar */
.range{position:relative;height:34px;margin:2px 7px 0}
.range .track{position:absolute;left:0;right:0;top:4px;height:6px;border-radius:3px;background:var(--fill)}
.range .band{position:absolute;top:4px;height:6px;border-radius:3px;background:rgba(52,199,89,.5)}
.range .dot{position:absolute;top:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2.5px solid var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.range .lim{position:absolute;top:17px;font-size:11px;color:var(--ink-3);transform:translateX(-50%);font-weight:500}
.range.big{height:44px}
.range.big .track,.range.big .band{height:10px;top:6px;border-radius:5px}
.range.big .dot{width:20px;height:20px;margin-left:-10px}
.range.big .lim{top:24px;font-size:12px}
/* chart */
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto;display:block}
.chart-wrap .pt{cursor:pointer}
.tipbox{position:absolute;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:9px;font-size:12px;pointer-events:none;transform:translate(-50%,-120%);white-space:nowrap}
.tipbox b{display:block;font-size:13px}
/* lists */
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:4px minmax(140px,1.3fr) 120px minmax(140px,1fr) 118px 28px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .mark{width:3px;height:30px;border-radius:2px}
.lrow .nm b{display:block;font-weight:600}
.lrow .val{font-weight:600;font-size:18px}
.lrow .val small{font-size:12px;font-weight:400;color:var(--ink-2)}
.group{padding:18px 22px}
.group summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer}
.group summary::-webkit-details-marker{display:none}
.group summary .chev{transition:transform .2s;color:var(--ink-3)}
.group[open] summary .chev{transform:rotate(90deg)}
.group .body{margin-top:8px}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:10px;align-items:flex-start}
.q input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:none}
.q span{flex:1}
.q .x{border:0;background:none;color:var(--ink-3);padding:0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:100px;padding:6px 12px;font-size:13px;font-weight:500;background:var(--fill)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.field{display:flex;gap:8px}
.field input,.field select,textarea{flex:1;border:0;background:var(--fill);border-radius:10px;padding:9px 12px;font-size:14px;min-width:0}
textarea{width:100%;resize:vertical;min-height:72px}
.bubble{background:var(--wa);border-radius:14px;padding:12px 14px;white-space:pre-wrap;font-size:14px}
.note{font-size:12px;color:var(--ink-3)}
.rep{display:grid;grid-template-columns:40px minmax(0,1fr) 110px 150px 120px 24px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.rep:hover{background:var(--fill)}
.rtile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.rtile svg{width:20px;height:20px}
.year{font-weight:700;font-size:15px;padding:14px 0 4px}
.repgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.repcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:none;text-align:left;cursor:pointer}
.spark{width:110px;height:32px}
.stat{flex-direction:row;align-items:center;gap:14px;padding:18px 20px}
.stat b{font-size:28px}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--bg);overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.modal-scrim{align-items:center;justify-content:center;padding:16px}
.modal{width:min(560px,100%);max-height:90%;overflow-y:auto;background:var(--card);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.close{border:0;background:var(--fill);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex:none}
pre.summary{white-space:pre-wrap;background:var(--fill);border-radius:10px;padding:14px;font-family:var(--font-body);font-size:13px;margin:0;max-height:340px;overflow:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline}
.term{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;font:inherit;font-size:12px;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.term svg{width:14px;height:14px}
.pop{position:fixed;z-index:70;width:300px;max-width:calc(100vw - 24px);background:var(--card);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:16px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.pop b{font-size:15px}
.modeseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.vt th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:1px solid var(--line)}
.vt td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.vt tr:last-child td{border-bottom:0}
.vt .flag{font-weight:700}
.chips .chip.term-chip{background:var(--card);color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.proto{font-size:12px;color:var(--ink-3);text-align:center}
.tabbar{display:none}
.mtop{display:none}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* responsive */
@media (max-width: 1100px){ .split{grid-template-columns:1fr} }
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .page{padding:16px 16px 110px;gap:18px}
  h1{font-size:30px}
  .g3,.g2{grid-template-columns:1fr}
  .search{width:100%}
  .hero{padding:20px}
  .hero .lead p.big{font-size:22px}
  .tile{flex:1;width:auto;min-width:90px;padding:10px 12px}
  .tile b{font-size:24px}
  .lrow{grid-template-columns:4px minmax(0,1fr) auto;row-gap:6px}
  .lrow .rb{grid-column:2 / 3}
  .lrow .st{grid-column:3 / 4;justify-self:end}
  .lrow .ib{display:none}
  .rep{grid-template-columns:40px minmax(0,1fr) 24px}
  .rep .rd,.rep .rt{display:none}
  .rep .rs{grid-column:2 / 3}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 6px 22px;z-index:30}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--ink-3)}
  .tabbar button svg{width:24px;height:24px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .mtop{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px 16px;font-weight:700}
  .mtop .logo{font-size:17px;padding:0}
  .mtop .sp{flex:1}
  .stat{padding:14px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Main navigation"></aside>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>
<div id="layer"></div>
<input type="file" id="file" accept=".pdf,image/*" multiple hidden>
<script>
/* ---------- icons ---------- */
const I={
 grid:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
 vault:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="12" r="3.2"/><path d="M12 8.8V7"/>',
 chart:'<path d="M4 18l5-6 4 3 7-9"/>', clip:'<rect x="6" y="4" width="12" height="17" rx="3"/><path d="M9 12h6M9 16h4"/>',
 book:'<path d="M5 5a2 2 0 012-2h11v15H7a2 2 0 00-2 2V5z"/><path d="M5 20a2 2 0 012-2h11v3H7a2 2 0 01-2-1z"/>',
 people:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14a5 5 0 014.5 5"/>',
 person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>', drop:'<path d="M12 3s6 7 6 11a6 6 0 01-12 0c0-4 6-11 6-11z"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>', speaker:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>', info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',

 const X=x=>((x-min)/(max-min)*100).toFixed(2);const st=status(key,v,sex);const col=st.k==='ok'?'var(--good)':st.k==='bad'?'var(--bad)':'var(--warn)';
 const lims=(simple()&&!opts.nums)?[[lo===0?null:(0+ +X(lo))/2,'Low'],[(+X(lo)+ +X(hi))/2,'Usual'],[(+X(hi)+100)/2,'High']].filter(x=>x[0]!=null).map(([x,l])=>`<span class="lim" style="left:${x.toFixed(1)}%">${l}</span>`).join(''):(lo===0?[hi]:[lo,hi]).map(x=>`<span class="lim num" style="left:${X(x)}%">${fmt(x)}</span>`).join('');
 return `<div class="range ${opts.big?'big':''}" role="img" aria-label="${esc(TESTS[key].name)} ${fmt(v)} ${esc(TESTS[key].unit)}, lab range ${fmt(lo)} to ${fmt(hi)}, ${st.t}"><div class="track"></div><div class="band" style="left:${X(lo)}%;width:${(X(hi)-X(lo)).toFixed(2)}%"></div><div class="dot" style="left:${X(v)}%;background:${col}"></div>${lims}</div>`}
const simple=()=>S.mode!=='veteran';
const SNAME={hb:'Oxygen in your blood',rbc:'Red blood cell count',mcv:'Size of red blood cells',mch:'Oxygen in each red cell',wbc:'Infection-fighting cells',plt:'Clotting cells',tsh:'Thyroid signal',ft4:'Thyroid hormone',fbs:'Sugar before eating',hba1c:'3-month sugar average',ldl:'“Bad” cholesterol',hdl:'“Good” cholesterol',tg:'Blood fat',vitd:'Vitamin D',b12:'Vitamin B12',creat:'Kidney cleaning',alt:'Liver health'};
const SGROUP={blood:'Blood',thyroid:'Thyroid',sugar:'Sugar',lipids:'Cholesterol and fats',vitamins:'Vitamins',organs:'Kidney and liver'};
const SAI={blood:['Your blood is carrying a little less oxygen than usual. Three related numbers point to the same thing, so your doctor will look at them together.','This is very common in Indian women and is usually easy to look into.'],
 thyroid:['The signal that tells your thyroid how hard to work is a bit high. The thyroid hormone itself is normal. Your doctor may want to check it again.','This number can change from day to day, so one reading is often checked again.'],
 sugar:['Your sugar is a little higher than usual, and has slowly gone up over two years.','The slow change over months matters more than a single test.'],
 lipids:['Your “bad” cholesterol is a little high and has slowly gone up. Your “good” cholesterol is normal.','Your doctor looks at this together with blood pressure, sugar, age and family history.'],
 vitamins:['Your vitamin D is low.','This is very common in India, even in young people.'],
 organs:['Your kidney and liver numbers look normal.','These are usually checked once a year.']};
const nm=k=>simple()?SNAME[k]:TESTS[k].name;
const gname=g=>simple()?SGROUP[g]:GROUPS.find(x=>x[0]===g)[1];
const SL={'In range':'Normal','Slightly low':'A bit low','Slightly high':'A bit high','Low · discuss soon':'Low · see doctor soon','High · discuss soon':'High · see doctor soon','Moved out of range':'Now outside usual range','Back in range':'Back to normal','Still slightly low':'Still a bit low','Still slightly high':'Still a bit high','All in range':'All normal'};
const slabel=t=>simple()?(SL[t]||t):t;
const pill=(st)=>`<span class="pill ${st.k}">${esc(slabel(st.t))}</span>`;
function termChip(k,label){const t=TESTS[k];return `<span class="term" role="button" tabindex="0" data-act="term" data-v="${k}">${esc(label||('On your report: '+t.name+(t.name.includes(t.term)?'':' ('+t.term+')')))} ${ic('info')}</span>`}
function subLine(k){const t=TESTS[k];return simple()?termChip(k):`${esc(t.term)} · ${esc(t.plain)}`}
function moveWord(k,span,suffix){const a=P().v[k];const [lo,hi]=rangeOf(k);const x=a[a.length-1-(span-1)]??a[0],y=a[a.length-1];const d=(y-x)/((hi-lo)||1);
 if(Math.abs(d)<0.03)return 'Stayed about the same'+suffix;return `Went ${d>0?'up':'down'} ${Math.abs(d)<0.3?'a little':'a lot'}${suffix}`}
function changeLine(k){return simple()?moveWord(k,2,' since last test'):changeText(k)}
function termPop(el,k){closePop();const t=TESTS[k];const st=status(k);const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='pop';d.id='pop';d.setAttribute('role','dialog');
 d.innerHTML=`<span class="xs muted">${esc(SNAME[k])}</span><b>${esc(t.name)}${t.name.includes(t.term)?'':' ('+esc(t.term)+')'}</b><p class="small">${esc(t.what)}</p><p class="small">${esc(st.dir==='high'?t.high:st.dir==='low'?t.low:'Inside your lab’s range')}</p><div style="display:flex;gap:6px;align-items:center"><span class="small muted">Your value</span> <b class="num" style="font-size:14px">${fmt(valOf(k))} ${esc(t.unit)}</b> ${pill(st)}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn soft small" style="padding:6px 12px" data-act="detail" data-v="${k}">Full details</button><button class="btn ghost small" data-act="dict" data-v="${esc(t.term)}">More in the dictionary</button></div>`;
 document.body.appendChild(d);translateDOM(d);const w=d.offsetWidth,hh=d.offsetHeight;let top=r.bottom+8;if(top+hh>innerHeight-8)top=Math.max(8,r.top-hh-8);d.style.top=top+'px';d.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+'px';d.querySelector('button')?.focus()}
function closePop(){document.getElementById('pop')?.remove()}
function modeSeg(){return `<div class="seg modeseg" role="group" aria-label="Reading mode">${[['simple','Simple'],['veteran','Veteran']].map(([k,l])=>`<button data-act="mode" data-v="${k}" aria-pressed="${S.mode===k}">${l}</button>`).join('')}</div>`}
function vetTable(ks){return `<div style="overflow-x:auto"><table class="vt"><thead><tr><th>Test</th><th>Result</th><th>Unit</th><th>Lab range</th><th>Previous</th><th>Change</th><th>Flag</th></tr></thead><tbody>${ks.map(k=>{const t=TESTS[k],st=status(k),a=P().v[k],[lo,hi]=rangeOf(k);const ch=a[a.length-1]-a[a.length-2];const fl=st.dir==='high'?'H':st.dir==='low'?'L':'';const col=st.k==='ok'?'var(--ink-3)':st.k==='bad'?'var(--bad-ink)':'var(--warn-ink)';
 return `<tr><td><button class="term" style="font-size:13px;font-weight:600;text-decoration:none;color:var(--ink)" data-act="detail" data-v="${k}">${esc(t.term)}</button><div class="xs muted">${esc(t.name)}</div></td><td style="font-weight:700;color:${st.k==='ok'?'var(--ink)':col}">${fmt(a[a.length-1])}</td><td class="muted">${esc(t.unit)}</td><td>${lo===0?'&lt; '+fmt(hi):fmt(lo)+'–'+fmt(hi)}</td><td class="muted">${fmt(a[a.length-2])}</td><td>${Math.abs(ch)<1e-9?'0':(ch>0?'+':'−')+fmt(Math.abs(ch))}</td><td class="flag" style="color:${col}">${fl||'–'}</td></tr>`}).join('')}</tbody></table></div>`}
function spark(key,w=110,h=32){const a=P().v[key];const [lo,hi]=rangeOf(key);const mn=Math.min(...a,lo)*0.95,mx=Math.max(...a,hi)*1.05;const Y=v=>(h-3)-(v-mn)/(mx-mn)*(h-6);const X=i=>3+i*(w-6)/(a.length-1);
 const st=status(key);const col=st.k==='ok'?'var(--good)':st.k==='bad'?'var(--bad)':'var(--warn)';
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><rect x="0" y="${Y(hi).toFixed(1)}" width="${w}" height="${Math.max(1,Y(lo)-Y(hi)).toFixed(1)}" fill="rgba(52,199,89,.14)" rx="3"/><polyline fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="${a.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/><circle cx="${X(a.length-1)}" cy="${Y(a[a.length-1])}" r="4" fill="${col}" stroke="var(--card)" stroke-width="2"/></svg>`}
function chart(key,span){const a=P().v[key].slice(-span),d=DATES.slice(-span);const [lo,hi]=rangeOf(key);const t=TESTS[key];const sm=simple();
 const W=680,H=250,l=40,r=16,top=14,b=210;let mn=Math.min(...a,lo),mx=Math.max(...a,hi);const pad=(mx-mn)*0.25||1;mn=Math.max(0,mn-pad);mx=mx+pad;
 const Y=v=>top+(mx-v)/(mx-mn)*(b-top);const X=i=>l+24+(a.length===1?0:i*(W-l-r-48)/(a.length-1));
 const ticks=[];const step=niceStep((mx-mn)/4);for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step)ticks.push(+v.toFixed(2));
 const pts=a.map((v,i)=>({x:X(i),y:Y(v),v,d:d[i]}));
 return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.name)} over time with your lab's range shaded">
 <rect x="${l}" y="${Y(hi).toFixed(1)}" width="${W-l-r}" height="${(Y(lo)-Y(hi)).toFixed(1)}" rx="6" fill="rgba(52,199,89,.12)"/>
 <text x="${W-r-8}" y="${(Y(hi)+16).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="var(--good-ink)">${sm?'Usual range':`Your lab’s range: ${fmt(lo)}–${fmt(hi)} ${esc(t.unit)}`}</text>
 ${sm?'':ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${l-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmt(v)}</text>`).join('')}
 <polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}"/>
 ${pts.map((p,i)=>{const last=i===pts.length-1;const st=status(key,p.v);const col=st.k==='ok'?'var(--good)':st.k==='bad'?'var(--bad)':'var(--warn)';return `<circle class="pt" tabindex="0" data-i="${i}" data-x="${(p.x/W*100).toFixed(2)}" data-y="${(p.y/H*100).toFixed(2)}" data-v="${fmt(p.v)} ${esc(t.unit)}" data-d="${p.d}" data-s="${esc(st.t)}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${last?7:5.5}" fill="${last?'var(--accent)':'var(--card)'}" stroke="var(--accent)" stroke-width="2.5"><title>${p.d}: ${fmt(p.v)} ${esc(t.unit)}</title></circle><text x="${p.x.toFixed(1)}" y="${b+24}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${p.d}</text>${sm?((i===0||last)?`<text x="${p.x.toFixed(1)}" y="${(p.y-14).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${last?'Now':'Then'}</text>`:''):`<text x="${p.x.toFixed(1)}" y="${(p.y-12).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink-2)">${fmt(p.v)}</text>`}`}).join('')}
 </svg><div class="tipbox" hidden></div></div>${sm?`<p style="font-weight:600;margin-top:6px">${esc(moveWord(key,span,''))} · ${esc(slabel(status(key).t))}</p>`:''}`}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const n=x/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}

['Red blood cells','लाल रक्त कोशिकाएँ','लाल रक्तपेशी'],['number of red cells','लाल कोशिकाओं की संख्या','लाल पेशींची संख्या'],['How many red blood cells are in a small amount of blood.','थोड़े से खून में कितनी लाल रक्त कोशिकाएँ हैं।','थोड्या रक्तात किती लाल रक्तपेशी आहेत.'],['Fewer red cells often goes with low haemoglobin.','कम लाल कोशिकाएँ अक्सर कम हीमोग्लोबिन के साथ होती हैं।','कमी लाल पेशी अनेकदा कमी हिमोग्लोबिनसोबत असतात.'],['More red cells can thicken the blood.','ज़्यादा लाल कोशिकाएँ खून को गाढ़ा कर सकती हैं।','जास्त लाल पेशींमुळे रक्त घट्ट होऊ शकते.'],
['Average red cell size','लाल कोशिकाओं का औसत आकार','लाल पेशींचा सरासरी आकार'],['how big your red cells are','आपकी लाल कोशिकाएँ कितनी बड़ी हैं','तुमच्या लाल पेशी किती मोठ्या आहेत'],['The average size of your red blood cells.','आपकी लाल रक्त कोशिकाओं का औसत आकार।','तुमच्या लाल रक्तपेशींचा सरासरी आकार.'],['Smaller cells are often looked at alongside iron levels.','छोटी कोशिकाओं को अक्सर आयरन के स्तर के साथ देखा जाता है।','लहान पेशी अनेकदा लोहाच्या पातळीसोबत पाहिल्या जातात.'],['Larger cells are often looked at alongside B12 and folate.','बड़ी कोशिकाओं को अक्सर B12 और फोलेट के साथ देखा जाता है।','मोठ्या पेशी अनेकदा B12 आणि फोलेटसोबत पाहिल्या जातात.'],

['White blood cells','सफ़ेद रक्त कोशिकाएँ','पांढऱ्या रक्तपेशी'],['cells that fight infection','संक्रमण से लड़ने वाली कोशिकाएँ','संसर्गाशी लढणाऱ्या पेशी'],['Cells that help your body fight infection.','कोशिकाएँ जो शरीर को संक्रमण से लड़ने में मदद करती हैं।','शरीराला संसर्गाशी लढायला मदत करणाऱ्या पेशी.'],['A low count can also matter; doctors read it with symptoms.','कम संख्या भी मायने रखती है; डॉक्टर इसे लक्षणों के साथ देखते हैं।','कमी संख्याही महत्त्वाची असते; डॉक्टर ती लक्षणांसोबत पाहतात.'],['High does not only mean infection; doctors read it with symptoms.','ज़्यादा का मतलब सिर्फ़ संक्रमण नहीं; डॉक्टर इसे लक्षणों के साथ देखते हैं।','जास्त म्हणजे फक्त संसर्ग नाही; डॉक्टर हे लक्षणांसोबत पाहतात.'],
['Platelets','प्लेटलेट्स','प्लेटलेट्स'],['cells that help blood clot','खून जमाने में मदद करने वाली कोशिकाएँ','रक्त गोठण्यास मदत करणाऱ्या पेशी'],['Small cells that help blood clot when you are cut.','छोटी कोशिकाएँ जो कटने पर खून जमाने में मदद करती हैं।','जखम झाल्यावर रक्त गोठण्यास मदत करणाऱ्या लहान पेशी.'],['Low platelets can mean easier bruising.','कम प्लेटलेट्स से आसानी से नील पड़ सकते हैं।','कमी प्लेटलेट्समुळे सहज काळे-निळे डाग पडू शकतात.'],['High platelets are read with other values.','ज़्यादा प्लेटलेट्स को दूसरे मानों के साथ देखा जाता है।','जास्त प्लेटलेट्स इतर मूल्यांसोबत पाहिले जातात.'],
['Thyroid signal','थायरॉइड संकेत','थायरॉइड संकेत'],['tells your thyroid how hard to work','थायरॉइड को बताता है कि कितना काम करे','थायरॉइडला किती काम करायचे ते सांगते'],['A hormone from the brain that tells the thyroid gland how hard to work.','दिमाग़ से आने वाला हार्मोन जो थायरॉइड ग्रंथि को बताता है कि कितना काम करना है।','मेंदूतून येणारा हार्मोन जो थायरॉइड ग्रंथीला किती काम करायचे ते सांगतो.'],['Low TSH is read together with FT4.','कम TSH को FT4 के साथ देखा जाता है।','कमी TSH हे FT4 सोबत पाहिले जाते.'],['High TSH is read together with FT4. One reading is often re-checked.','ज़्यादा TSH को FT4 के साथ देखा जाता है। एक रीडिंग की अक्सर दोबारा जाँच होती है।','जास्त TSH हे FT4 सोबत पाहिले जाते. एकच वाचन अनेकदा पुन्हा तपासले जाते.'],

['Fasting sugar','खाली पेट शुगर','उपाशीपोटी साखर'],['blood sugar after 8–10 hours without food','8–10 घंटे बिना खाए खून में शुगर','8–10 तास न खाल्ल्यानंतर रक्तातील साखर'],['Your blood sugar after not eating for 8 to 10 hours.','8 से 10 घंटे कुछ न खाने के बाद आपके खून में शुगर।','8 ते 10 तास काही न खाल्ल्यानंतरची तुमची रक्तातील साखर.'],['Low fasting sugar can make you feel shaky or faint.','कम फ़ास्टिंग शुगर से कंपकंपी या चक्कर आ सकता है।','उपाशीपोटी साखर कमी असल्यास थरथर किंवा चक्कर येऊ शकते.'],['Above range is read together with HbA1c.','दायरे से ऊपर होने पर इसे HbA1c के साथ देखा जाता है।','मर्यादेपेक्षा जास्त असल्यास हे HbA1c सोबत पाहिले जाते.'],

['Haemoglobin, MCV and MCH are all slightly low. Doctors read these three together: they describe red cells that are a little small and carry a little less oxygen.','हीमोग्लोबिन, MCV और MCH तीनों थोड़े कम हैं। डॉक्टर इन तीनों को साथ में देखते हैं: ये बताते हैं कि लाल कोशिकाएँ थोड़ी छोटी हैं और थोड़ी कम ऑक्सीजन ले जाती हैं।','हिमोग्लोबिन, MCV आणि MCH तिन्ही थोडे कमी आहेत. डॉक्टर हे तिन्ही एकत्र पाहतात: लाल पेशी थोड्या लहान आहेत आणि थोडा कमी ऑक्सिजन वाहून नेतात, असे ते दाखवतात.'],
['Slightly low haemoglobin is common in Indian women: 57% of women aged 15–49 (NFHS-5). It is usually simple to look into.','थोड़ा कम हीमोग्लोबिन भारतीय महिलाओं में आम है: 15–49 वर्ष की 57% महिलाएँ (NFHS-5)। इसकी जाँच आमतौर पर आसान होती है।','थोडे कमी हिमोग्लोबिन भारतीय महिलांमध्ये सामान्य आहे: 15–49 वयोगटातील 57% महिला (NFHS-5). याची तपासणी सहसा सोपी असते.'],
['Could my low haemoglobin be related to iron or B12?','क्या मेरा कम हीमोग्लोबिन आयरन या B12 से जुड़ा हो सकता है?','माझे कमी हिमोग्लोबिन लोह किंवा B12 शी संबंधित असू शकते का?'],['When should I repeat my blood count?','मुझे ब्लड काउंट दोबारा कब करवाना चाहिए?','मी रक्त तपासणी पुन्हा कधी करावी?'],
['Your TSH, the signal that tells the thyroid how hard to work, is above your lab’s range. FT4, the hormone itself, is in range. Doctors look at both together.','आपका TSH, यानी वह संकेत जो थायरॉइड को बताता है कि कितना काम करे, आपकी लैब के दायरे से ऊपर है। FT4, यानी ख़ुद हार्मोन, दायरे में है। डॉक्टर दोनों को साथ में देखते हैं।','तुमचा TSH, म्हणजे थायरॉइडला किती काम करायचे ते सांगणारा संकेत, तुमच्या लॅबच्या मर्यादेपेक्षा जास्त आहे. FT4, म्हणजे प्रत्यक्ष हार्मोन, मर्यादेत आहे. डॉक्टर दोन्ही एकत्र पाहतात.'],
['TSH can change with time of day and recent illness, so one reading is often re-checked before anything else.','TSH दिन के समय और हाल की बीमारी के साथ बदल सकता है, इसलिए अक्सर पहले एक रीडिंग की दोबारा जाँच होती है।','TSH दिवसाची वेळ आणि अलीकडील आजारानुसार बदलू शकतो, म्हणून अनेकदा आधी एक वाचन पुन्हा तपासले जाते.'],
['Should I re-test my TSH, and when?','क्या मुझे TSH दोबारा जाँचना चाहिए, और कब?','मी TSH पुन्हा तपासावा का, आणि कधी?'],['Do I need any other thyroid tests?','क्या मुझे थायरॉइड की कोई और जाँच चाहिए?','मला थायरॉइडच्या आणखी तपासण्या लागतील का?'],
['Your fasting sugar and your 3-month average (HbA1c) are above your lab’s range and have crept up over two years. Doctors read these two together.','आपकी खाली पेट शुगर और 3 महीने की औसत शुगर (HbA1c) आपकी लैब के दायरे से ऊपर हैं और दो साल में धीरे-धीरे बढ़ी हैं। डॉक्टर इन दोनों को साथ में देखते हैं।','तुमची उपाशीपोटी साखर आणि 3 महिन्यांची सरासरी (HbA1c) तुमच्या लॅबच्या मर्यादेपेक्षा जास्त आहेत आणि दोन वर्षांत हळूहळू वाढली आहेत. डॉक्टर हे दोन्ही एकत्र पाहतात.'],
['HbA1c reflects about three months, so it moves slowly. The trend matters more than one reading.','HbA1c लगभग तीन महीनों को दिखाता है, इसलिए धीरे बदलता है। एक रीडिंग से ज़्यादा रुझान मायने रखता है।','HbA1c सुमारे तीन महिने दाखवतो, म्हणून हळू बदलतो. एका वाचनापेक्षा कल महत्त्वाचा.'],
['What do my sugar trends mean for me?','मेरी शुगर के रुझान का मेरे लिए क्या मतलब है?','माझ्या साखरेच्या कलाचा माझ्यासाठी काय अर्थ आहे?'],['How often should I check HbA1c?','मुझे HbA1c कितनी बार जाँचना चाहिए?','मी HbA1c किती वेळा तपासावा?'],
['LDL, often called “bad” cholesterol, is above your lab’s range and has risen slowly. HDL and triglycerides are inside range.','LDL, जिसे अक्सर “बुरा” कोलेस्ट्रॉल कहते हैं, आपकी लैब के दायरे से ऊपर है और धीरे-धीरे बढ़ा है। HDL और ट्राइग्लिसराइड्स दायरे में हैं।','LDL, ज्याला अनेकदा “वाईट” कोलेस्ट्रॉल म्हणतात, तुमच्या लॅबच्या मर्यादेपेक्षा जास्त आहे आणि हळूहळू वाढले आहे. HDL आणि ट्रायग्लिसराइड्स मर्यादेत आहेत.'],
['Doctors read cholesterol together with blood pressure, sugar, age and family history.','डॉक्टर कोलेस्ट्रॉल को ब्लड प्रेशर, शुगर, उम्र और पारिवारिक इतिहास के साथ देखते हैं।','डॉक्टर कोलेस्ट्रॉल रक्तदाब, साखर, वय आणि कौटुंबिक इतिहासासोबत पाहतात.'],
['Is my LDL worth acting on now?','क्या मेरे LDL पर अभी कुछ करना चाहिए?','माझ्या LDL बाबत आत्ता काही करावे का?'],['When should I re-check my lipids?','मुझे लिपिड दोबारा कब जाँचने चाहिए?','मी लिपिड पुन्हा कधी तपासावे?'],
['Vitamin D is below your lab’s range and has dipped over two years. B12 is inside range but close to the lower edge.','विटामिन D आपकी लैब के दायरे से कम है और दो साल में घटा है। B12 दायरे में है लेकिन निचले किनारे के पास है।','व्हिटॅमिन D तुमच्या लॅबच्या मर्यादेपेक्षा कमी आहे आणि दोन वर्षांत घटले आहे. B12 मर्यादेत आहे पण खालच्या टोकाजवळ आहे.'],
['Low vitamin D is very common in India, including in young adults.','भारत में विटामिन D की कमी बहुत आम है, युवाओं में भी।','भारतात व्हिटॅमिन D ची कमतरता खूप सामान्य आहे, तरुणांमध्येही.'],
['Should I take anything for vitamin D?','क्या मुझे विटामिन D के लिए कुछ लेना चाहिए?','मी व्हिटॅमिन D साठी काही घ्यावे का?'],['Should B12 be re-checked?','क्या B12 दोबारा जाँचना चाहिए?','B12 पुन्हा तपासावे का?'],
['Your kidney and liver markers are inside your lab’s range.','आपके किडनी और लिवर के संकेतक आपकी लैब के दायरे में हैं।','तुमचे मूत्रपिंड आणि यकृताचे निर्देशक तुमच्या लॅबच्या मर्यादेत आहेत.'],['These are often checked once a year as part of a routine panel.','इन्हें अक्सर साल में एक बार रूटीन जाँच में देखा जाता है।','हे अनेकदा वर्षातून एकदा नियमित तपासणीत पाहिले जातात.'],['Do I need these checked every year?','क्या इन्हें हर साल जाँचना ज़रूरी है?','हे दरवर्षी तपासणे आवश्यक आहे का?'],
['All values in this group are inside your lab’s range.','इस समूह के सभी मान आपकी लैब के दायरे में हैं।','या गटातील सर्व मूल्ये तुमच्या लॅबच्या मर्यादेत आहेत.'],

['Only low values are a problem','सिर्फ़ कम मान ही समस्या हैं','फक्त कमी मूल्येच समस्या असतात'],['High haemoglobin matters too. Above about 16 g/dL, blood can thicken. Both directions are worth checking.','ज़्यादा हीमोग्लोबिन भी मायने रखता है। लगभग 16 g/dL से ऊपर खून गाढ़ा हो सकता है। दोनों दिशाओं की जाँच ज़रूरी है।','जास्त हिमोग्लोबिनही महत्त्वाचे आहे. सुमारे 16 g/dL पेक्षा जास्त झाल्यास रक्त घट्ट होऊ शकते. दोन्ही बाजू तपासणे महत्त्वाचे आहे.'],
['A high white cell count only means infection','सफ़ेद कोशिकाएँ ज़्यादा होने का मतलब सिर्फ़ संक्रमण है','पांढऱ्या पेशी जास्त म्हणजे फक्त संसर्ग'],['A low count can also matter, and a very high one is read carefully. Doctors read it with your symptoms.','कम संख्या भी मायने रखती है, और बहुत ज़्यादा संख्या को ध्यान से देखा जाता है। डॉक्टर इसे आपके लक्षणों के साथ देखते हैं।','कमी संख्याही महत्त्वाची असते, आणि खूप जास्त संख्या काळजीपूर्वक पाहिली जाते. डॉक्टर ती तुमच्या लक्षणांसोबत पाहतात.'],
['One flagged value means something is wrong','एक चिह्नित मान का मतलब है कि कुछ गड़बड़ है','एक चिन्हांकित मूल्य म्हणजे काहीतरी बिघडले आहे'],['Doctors read values together and with symptoms. Many flags are common and simple to look into.','डॉक्टर मानों को साथ में और लक्षणों के साथ देखते हैं। कई चिह्न आम होते हैं और उनकी जाँच आसान होती है।','डॉक्टर मूल्ये एकत्र आणि लक्षणांसोबत पाहतात. अनेक चिन्हे सामान्य असतात आणि तपासायला सोपी असतात.'],
['“Normal” is the same at every lab','हर लैब में “सामान्य” एक जैसा होता है','प्रत्येक लॅबमध्ये “सामान्य” सारखेच असते'],['Each lab sets its own ranges, and they differ by machine, sex and age. AasanReport always shows your lab’s range.','हर लैब अपने दायरे तय करती है, और वे मशीन, लिंग और उम्र के हिसाब से अलग होते हैं। AasanReport हमेशा आपकी लैब का दायरा दिखाता है।','प्रत्येक लॅब स्वतःच्या मर्यादा ठरवते, आणि त्या यंत्र, लिंग आणि वयानुसार वेगळ्या असतात. AasanReport नेहमी तुमच्या लॅबची मर्यादा दाखवते.'],

['Your blood is carrying a little less oxygen than usual. Three related numbers point to the same thing, so your doctor will look at them together.','आपका खून सामान्य से थोड़ी कम ऑक्सीजन ले जा रहा है। तीन जुड़े हुए अंक एक ही बात बताते हैं, इसलिए डॉक्टर इन्हें साथ में देखेंगे।','तुमचे रक्त नेहमीपेक्षा थोडा कमी ऑक्सिजन वाहून नेत आहे. तीन संबंधित आकडे एकच गोष्ट दाखवतात, म्हणून डॉक्टर ते एकत्र पाहतील.'],

['The signal that tells your thyroid how hard to work is a bit high. The thyroid hormone itself is normal. Your doctor may want to check it again.','थायरॉइड को काम बताने वाला संकेत थोड़ा ज़्यादा है। थायरॉइड हार्मोन ख़ुद सामान्य है। डॉक्टर इसे दोबारा जाँचना चाह सकते हैं।','थायरॉइडला काम सांगणारा संकेत थोडा जास्त आहे. थायरॉइड हार्मोन स्वतः सामान्य आहे. डॉक्टर तो पुन्हा तपासू इच्छितील.'],
['This number can change from day to day, so one reading is often checked again.','यह अंक दिन-ब-दिन बदल सकता है, इसलिए अक्सर दोबारा जाँचा जाता है।','हा आकडा दिवसागणिक बदलू शकतो, म्हणून अनेकदा पुन्हा तपासला जातो.'],
['Your sugar is a little higher than usual, and has slowly gone up over two years.','आपकी शुगर सामान्य से थोड़ी ज़्यादा है, और दो साल में धीरे-धीरे बढ़ी है।','तुमची साखर नेहमीपेक्षा थोडी जास्त आहे, आणि दोन वर्षांत हळूहळू वाढली आहे.'],
['The slow change over months matters more than a single test.','एक जाँच से ज़्यादा, महीनों में धीरे-धीरे होने वाला बदलाव मायने रखता है।','एका तपासणीपेक्षा महिन्यांतला हळूहळू बदल जास्त महत्त्वाचा.'],
['Your “bad” cholesterol is a little high and has slowly gone up. Your “good” cholesterol is normal.','आपका “बुरा” कोलेस्ट्रॉल थोड़ा ज़्यादा है और धीरे-धीरे बढ़ा है। “अच्छा” कोलेस्ट्रॉल सामान्य है।','तुमचे “वाईट” कोलेस्ट्रॉल थोडे जास्त आहे आणि हळूहळू वाढले आहे. “चांगले” कोलेस्ट्रॉल सामान्य आहे.'],
['Your doctor looks at this together with blood pressure, sugar, age and family history.','डॉक्टर इसे ब्लड प्रेशर, शुगर, उम्र और परिवार के इतिहास के साथ देखते हैं।','डॉक्टर हे रक्तदाब, साखर, वय आणि कौटुंबिक इतिहासासोबत पाहतात.'],
['Your vitamin D is low.','आपका विटामिन D कम है।','तुमचे व्हिटॅमिन D कमी आहे.'],['This is very common in India, even in young people.','यह भारत में बहुत आम है, युवाओं में भी।','हे भारतात खूप सामान्य आहे, तरुणांमध्येही.'],
['Your kidney and liver numbers look normal.','आपकी किडनी और लिवर के अंक सामान्य हैं।','तुमचे मूत्रपिंड आणि यकृताचे आकडे सामान्य आहेत.'],['These are usually checked once a year.','इन्हें आमतौर पर साल में एक बार जाँचा जाता है।','हे सहसा वर्षातून एकदा तपासले जातात.'],

['Get help right away if','तुरंत मदद लें अगर','लगेच मदत घ्या जर'],['You have chest pain, severe breathlessness, fainting, confusion or heavy bleeding. Don’t wait for a report: call your doctor or 112.','सीने में दर्द, बहुत तेज़ साँस फूलना, बेहोशी, उलझन या ज़्यादा ख़ून बहना हो। रिपोर्ट का इंतज़ार न करें: डॉक्टर को या 112 पर कॉल करें।','छातीत दुखणे, खूप धाप लागणे, बेशुद्ध पडणे, गोंधळ किंवा जास्त रक्तस्राव होत असल्यास. अहवालाची वाट पाहू नका: डॉक्टरांना किंवा 112 वर कॉल करा.'],

 [/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) ’(\d\d)$/,(m,l)=>`${MONL[l][MON.indexOf(m[1])]} ’${m[2]}`],
 [/^Clinic visit, (\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)$/,(m,l)=>`${l==='hi'?'क्लिनिक विज़िट':'क्लिनिक भेट'}, ${m[1]} ${MONL[l][MON.indexOf(m[2])]}`]);
PAT.push([/^Bring these (\d+) things to your next visit\. There’s no rush, but don’t skip it\.$/,(m,l)=>l==='hi'?`अगली मुलाक़ात पर ये ${m[1]} बातें ले जाएँ। जल्दी नहीं है, पर इसे टालें नहीं।`:`पुढच्या भेटीत या ${m[1]} गोष्टी घेऊन जा. घाई नाही, पण टाळू नका.`]);
PAT.push(
 [/^Went (up|down) (a little|a lot)(.*)$/,(m,l)=>{const w=l==='hi'?{up:'बढ़ा',down:'घटा','a little':'थोड़ा','a lot':'काफ़ी'}:{up:'वाढले',down:'कमी झाले','a little':'थोडे','a lot':'बरेच'};const sfx={' since last test':l==='hi'?'पिछली जाँच से ':'मागील तपासणीपासून ',' over 2 years':l==='hi'?'2 साल में ':'2 वर्षांत ','':''}[m[3]]??'';return `${sfx}${w[m[2]]} ${w[m[1]]}`}],
 [/^Stayed about the same(.+)$/,(m,l)=>{const sfx={' since last test':l==='hi'?'पिछली जाँच से ':'मागील तपासणीपासून ',' over 2 years':l==='hi'?'2 साल में ':'2 वर्षांत '}[m[1]]??'';return sfx+(l==='hi'?'लगभग वैसा ही रहा':'जवळपास तसेच राहिले')}],
 [/^(\d+) of (\d+) need a look$/,(m,l)=>l==='hi'?`${m[2]} में से ${m[1]} पर ध्यान दें`:`${m[2]} पैकी ${m[1]} कडे लक्ष द्या`],
 [/^All (\d+) normal$/,(m,l)=>l==='hi'?`सभी ${m[1]} सामान्य`:`सर्व ${m[1]} सामान्य`],
 [/^From your (.+) report, (.+)$/,(m,l)=>l==='hi'?`आपकी ${m[1]} रिपोर्ट से, ${tr(m[2])}`:`तुमच्या ${m[1]} अहवालातून, ${tr(m[2])}`],
 [/^On your report: (.+)$/,(m,l)=>(l==='hi'?'रिपोर्ट पर: ':'अहवालावर: ')+tr(m[1])]);
function pat(t){for(const [re,fn] of PAT){const m=t.match(re);if(m){const r=fn(m,S.lang);if(r!=null)return r}}return null}
function tr(s){if(S.lang==='en'||s==null)return s;const m=String(s).match(/^(\s*)([\s\S]*?)(\s*)$/);const t=m[2];if(!t)return s;
 let r=look(t);if(r==null&&t.includes(' · '))r=t.split(' · ').map(p=>look(p)??pat(p)??p).join(' · ');if(r==null)r=pat(t);
 return r==null?s:m[1]+r+m[3]}
function translateDOM(root){if(S.lang==='en'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('textarea,pre,script,style,title,.notr'))return NodeFilter.FILTER_REJECT;return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
 const list=[];while(w.nextNode())list.push(w.currentNode);for(const n of list){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
 root.querySelectorAll('[placeholder]').forEach(e=>{e.placeholder=tr(e.placeholder)})}

/* ---------- render & routing ---------- */
const VIEWS={summary:vSummary,vault:vVault,trends:vTrends,doctor:vDoctor,family:vFamily,dictionary:vDictionary,profile:vProfile};
function applyDisplay(){const r=document.documentElement;if(S.dark)r.dataset.theme='dark';else if(r.dataset.theme==='dark'&&S._setDark)r.dataset.theme='light';if(S.contrast)r.dataset.contrast='high';else delete r.dataset.contrast;if(S.large)r.dataset.size='large';else delete r.dataset.size;r.lang=S.lang==='en'?'en':S.lang}
function render(keepScroll=true){const m=document.getElementById('main');const st=m.scrollTop;applyDisplay();renderSide();renderTabs();m.innerHTML=VIEWS[S.view]();translateDOM(m);translateDOM(document.getElementById('side'));translateDOM(document.getElementById('tabbar'));if(keepScroll)m.scrollTop=st;bindInputs()}
function go(v){if(!VIEWS[v])v='summary';S.view=v;if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}}render(false);document.getElementById('main').scrollTop=0}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==S.view){S.view=v;render(false)}});
function bindInputs(){const q=document.getElementById('q');if(q){q.oninput=()=>{S.search=q.value;const s=q.value.trim().toLowerCase();const box=document.getElementById('qres');if(!s){box.innerHTML='';return}
  const hits=Object.entries(TESTS).filter(([k,t])=>(t.name+' '+t.term+' '+t.plain).toLowerCase().includes(s)).slice(0,6);box.innerHTML=`<div class="results">${hits.map(([k,t])=>`<button data-act="detail" data-v="${k}">${esc(t.name)} <span class="muted small">${esc(t.term)} · ${fmt(valOf(k))} ${esc(t.unit)}</span></button>`).join('')}<button data-act="dictsearch">Search the dictionary for “${esc(q.value)}”</button></div>`;translateDOM(box)};
  q.onkeydown=e=>{if(e.key==='Enter'){S.dictQuery=q.value;S.search='';go('dictionary')}if(e.key==='Escape'){document.getElementById('qres').innerHTML=''}}}
 const vq=document.getElementById('vq');if(vq)vq.oninput=()=>{S.vaultQuery=vq.value;const pos=vq.selectionStart;render();const n=document.getElementById('vq');n.focus();n.setSelectionRange(pos,pos)};
 const dq=document.getElementById('dq');if(dq)dq.oninput=()=>{S.dictQuery=dq.value;const pos=dq.selectionStart;render();const n=document.getElementById('dq');n.focus();n.setSelectionRange(pos,pos)};
 const notes=document.getElementById('notes');if(notes)notes.oninput=()=>{S.notes=notes.value};
 bindChart(document.getElementById('main'));
}
function bindChart(root){root.querySelectorAll('.chart-wrap').forEach(cw=>{const tip=cw.querySelector('.tipbox');const show=c=>{tip.hidden=false;tip.style.left=c.dataset.x+'%';tip.style.top=c.dataset.y+'%';tip.innerHTML=`<b>${c.dataset.v}</b>${esc(tr(c.dataset.d))} · ${esc(tr(c.dataset.s))}`};cw.querySelectorAll('.pt').forEach(c=>{c.onmouseenter=()=>show(c);c.onfocus=()=>show(c);c.onclick=()=>show(c);c.onmouseleave=c.onblur=()=>{tip.hidden=true}})})}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='qform'){const v=document.getElementById('qnew').value.trim();if(v){S.questions.push({t:v,done:false});render();toast('Question added')}}
 if(f.id==='reasonform'){const v=document.getElementById('rnew').value.trim();if(v){S.reasons[v]=true;render()}}
 if(f.id==='askform'){const v=document.getElementById('askq').value.trim();if(v)answer(v)}
 if(f.id==='accessform'){const w=document.getElementById('aw').value.trim();if(!w)return;S.access.push({who:w,what:`${document.getElementById('at').value} · ${document.getElementById('ad').value==='Until I revoke'?'until you revoke':'expires in '+document.getElementById('ad').value}`});render();toast(`${w} can now see your ${document.getElementById('at')?'report':'summary'}`)}});
let lastRemoved=null;
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act==='qdone'){S.questions[+t.dataset.v].done=t.checked;render()}});
document.getElementById('file').addEventListener('change',e=>{const files=[...e.target.files];files.forEach((f,i)=>{const id='u'+Date.now()+i;const img=/^image\//.test(f.type);const r={id,title:f.name.replace(/\.[^.]+$/,'')||'New report',lab:img?'Scanned photo':'Uploaded PDF',date:'Just now',year:2026,type:'Blood',tests:0,status:'Reading values…',k:'neutral',processing:true};S.reports.unshift(r);setTimeout(()=>{r.processing=false;r.tests=Math.floor(Math.random()*10)+3;r.status='Filed';r.k='ok';render();toast(`${r.title} filed in your Vault`)},1800)});if(files.length){S.view='vault';render(false);toast(`Reading ${files.length} ${files.length===1?'file':'files'}…`)}e.target.value=''});
document.addEventListener('click',e=>{if(!e.target.closest('#pop'))closePop();const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
 if(a==='closebg'){if(e.target===el)closeLayer();return}
 if(a!=='qdone'&&el.tagName!=='LABEL')e.preventDefault&&(el.tagName==='A'?0:0);
 switch(a){
  case 'go':closeLayer();go(v);break;
  case 'group':go('summary');setTimeout(()=>{const d=document.getElementById('grp-'+v);if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})}},30);break;
  case 'profile':S.profile=v;S.rangeSex=null;if(TESTS[S.trendKey]&&!offGroups().includes(TESTS[S.trendKey].group)){const g=offGroups()[0];if(g){const k=SYSTEMS.find(s=>TESTS[s[0]].group===g);if(k)S.trendKey=k[0]}}render();toast(`Showing ${P().short}’s report`);break;
  case 'toggle':S[v]=!S[v];if(v==='dark')S._setDark=true;store.set(v,S[v]);if(v==='readAloud'&&!S[v]&&window.speechSynthesis){speechSynthesis.cancel();S.speaking=false}render();break;
  case 'lang':S.lang=v;store.set('lang',v);render();break;
  case 'listen':speak(spokenSummary());break;
  case 'speak':speak(v);break;
  case 'trend':S.trendKey=v;render();break;
  case 'trendpick':S.trendKey=v;render();document.getElementById('main').scrollTo({top:0,behavior:'smooth'});break;
  case 'trendgo':S.trendKey=v;go('trends');break;
  case 'span':S.span=+v;render();break;
  case 'detail':closePop();document.getElementById('qres')&&(document.getElementById('qres').innerHTML='');detail(v);break;
  case 'explain':explain(v);break;
  case 'ask':ask(v);break;
  case 'askchip':document.getElementById('askq').value=tr(v);answer(v);break;
  case 'addq':if(!S.questions.some(q=>q.t===v)){S.questions.push({t:v,done:false});toast('Added to your visit questions')}el.disabled=true;el.textContent='Added';if(!document.querySelector('.scrim'))render();break;
  case 'qdel':S.questions.splice(+v,1);render();break;
  case 'myth':S.mythIdx=(S.mythIdx+1)%MYTHS.length;render();break;
  case 'rsex':S.rangeSex=v;render();break;
  case 'scroll':{const t=document.getElementById(v);t&&t.scrollIntoView({behavior:'smooth',block:'start'});break}
  case 'reason':S.reasons[v]=!S.reasons[v];render();break;
  case 'clinics':clinics();break;
  case 'cfilter':S.clinicFilter=v;render();break;
  case 'visitsummary':visitSummary();break;
  case 'copy':copyText(document.getElementById(v).textContent);break;
  case 'copyshare':copyText(shareText(false));break;
  case 'recip':S.recipients[v]=!S.recipients[v];render();break;
  case 'incvals':S.includeValues=!S.includeValues;render();break;
  case 'dict':closePop();closeLayer();S.dictQuery=v;go('dictionary');break;
  case 'dictsearch':S.dictQuery=S.search;S.search='';go('dictionary');break;
  case 'video':video(+v);break;
  case 'vfilter':S.vaultFilter=v;render();break;
  case 'vmode':S.vaultMode=v;render();break;
  case 'report':reportSheet(v);break;
  case 'upload':document.getElementById('file').click();break;
  case 'sync':{const b=document.getElementById('syncbtn');if(b){b.disabled=true;b.innerHTML=ic('sync','class="spin"')+'Syncing…'}setTimeout(()=>{if(!S.synced){S.reports.unshift({id:'r0',title:'Vitamin B12 re-check',lab:'Dr Lal PathLabs',date:'15 Nov 2026',year:2026,type:'Blood',tests:1,status:'All in range',k:'ok'});S.synced=true;toast('Synced with ABHA · 1 new report from Dr Lal PathLabs')}else toast('Already up to date');S.view==='vault'?render():go('vault')},1200);break}
  case 'remind':S.reminders[v]=!S.reminders[v];render();toast(S.reminders[v]?'We’ll remind you':'Reminder removed');break;
  case 'revoke':lastRemoved={i:+v,item:S.access[+v]};S.access.splice(+v,1);render();toast(`Access removed for ${lastRemoved.item.who}`,true);break;
  case 'undo':if(lastRemoved){S.access.splice(lastRemoved.i,0,lastRemoved.item);lastRemoved=null;render();document.getElementById('toastbox').innerHTML=''}break;
  case 'sharereport':S.access.push({who:'Doctor link',what:'Full report · expires in 7 days'});closeLayer();toast('A 7-day doctor link was added to “Who can see your Vault”');if(S.view==='vault')render();break;
  case 'close':closeLayer();break;
  case 'sources':sourcesModal(v);break;
  case 'mode':S.mode=v;store.set('mode',v);closePop();render();toast(v==='simple'?'Simple mode: plain words and simple graphs':'Veteran mode: medical terms and full numbers');break;
  case 'term':termPop(el,v);break;
  case 'reveal':S.revealed[v]=true;render();break;
 }});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('pop')){closePop();return}if(document.querySelector('.scrim'))closeLayer()}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('span[data-act="term"]')){e.preventDefault();termPop(e.target,e.target.dataset.v)}});
document.addEventListener('scroll',closePop,true);
(function init(){const v=location.hash.slice(1);if(VIEWS[v])S.view=v;render(false)})();
</script>
